<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon (online image) -->
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/rp1WdTf4/mobile-quick-fix-banner-fixed-qr.jpg" />
    <link rel="apple-touch-icon" href="https://i.postimg.cc/rp1WdTf4/mobile-quick-fix-banner-fixed-qr.jpg" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Title -->
    <title>Mobile Quick Fix | Phone, Tablet &amp; Laptop Repairs at Your Door</title>

    <!-- Meta description for search engines -->
    <meta
      name="description"
      content="Mobile Quick Fix; fast, reliable phone repairs at your door. Screen repairs, battery replacement, water damage and charging port repairs for all major brands, plus tablets, laptops and gaming consoles."
    />

    <!-- Open Graph meta tags for enhanced sharing (WhatsApp, Facebook etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mobile Quick Fix" />
    <meta property="og:title" content="Mobile Quick Fix | Repairs at Your Door" />
    <meta
      property="og:description"
      content="Cracked screen, dead battery or water damage? We come to you and fix phones, tablets, laptops and consoles on the spot. Call or WhatsApp 07572 424207."
    />
    <meta property="og:image" content="https://i.postimg.cc/rp1WdTf4/mobile-quick-fix-banner-fixed-qr.jpg" />
    <meta property="og:url" content="https://mobilequickfix.co.uk/" />

    <!-- ===== Status-bar / Theme-color Tags ===== -->
    <!-- 1) Android Chrome (and many Android browsers) will paint the status bar area white -->
    <meta name="theme-color" content="#ffffff" />

    <!-- 2) iOS Safari when saved as a Home-Screen Web App: use a white status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Quick Fix" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
